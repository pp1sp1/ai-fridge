name: "Fridge Vision AI"
version: "1.0.0"
slug: "fridge_vision_ai"
description: "YOLO-World v2 computer vision service for smart fridge inventory"
startup: "services"
boot: "auto"
arch:
  - aarch64
  - amd64
  - armv7
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "FastAPI REST API"
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - ssl:rw
options:
  model: yolov8s-worldv2.pt
  confidence_threshold: 0.25
schema:
  model: str
  confidence_threshold: float
