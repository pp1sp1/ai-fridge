name: Fridge Vision AI
version: "1.3.1"
slug: fridge-vision-ai
description: YOLO-World zero-shot vision service for the Fridge Vision Inventory integration.
url: https://github.com/your-github-user/fridge-vision-inventory
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Vision AI HTTP API
watchdog: "http://[HOST]:8000/api/health"
hassio_api: false
homeassistant_api: false
auth_api: false
ingress: false
host_network: false
options:
  model: yolov8s-worldv2.pt
  image_size: 640
  log_level: info
schema:
  model: list(yolov8s-worldv2.pt|yolov8m-worldv2.pt)
  image_size: int(320,1280)
  log_level: list(trace|debug|info|warning|error|fatal)
