add_item:
  name: Add item
  description: >
    Adds an inventory item and records it in the change history. The AI
    prompt is optional: without one the item is stored but never
    auto-detected by the vision model. Adding an item with a prompt
    re-parameterizes the AI model.
  fields:
    name:
      name: Name
      description: Display name of the product, e.g. "Mleko 3.2%".
      required: true
      example: "Mleko 3.2%"
      selector:
        text:
    ai_prompt:
      name: AI prompt
      description: >
        English detection prompt for YOLO-World, e.g. "milk carton".
        Optional: leave empty for items that are only tracked manually.
      example: "milk carton"
      selector:
        text:
    quantity:
      name: Quantity
      description: Initial quantity (0 or more, decimals allowed).
      default: 1
      example: 1
      selector:
        number:
          min: 0
          max: 9999
          step: 0.5
          mode: box
    location:
      name: Location
      description: Storage location of the item.
      default: "fridge"
      example: "fridge"
      selector:
        text:
    unit:
      name: Unit
      description: Unit of measurement, e.g. "szt", "L", "kg".
      example: "szt"
      selector:
        text:
    category:
      name: Category
      description: Item category, e.g. "Nabial".
      example: "Nabial"
      selector:
        text:
    expiry_date:
      name: Expiry date
      description: Expiration date (YYYY-MM-DD).
      example: "2026-12-31"
      selector:
        date:
    description:
      name: Description
      description: Free-text description.
      selector:
        text:
update_item:
  name: Update item
  description: >
    Updates any fields of an inventory item and records the change in the
    history. Changing the AI prompt triggers a model re-parameterization.
    The prompt can be cleared; an item without a prompt is kept in the
    inventory and simply stops being auto-detected.
  fields:
    item_id:
      name: Item ID
      description: ID of the inventory item to update.
      required: true
      example: "6f0d3a1e8c2b4f6e9d7a1b2c3d4e5f60"
      selector:
        text:
    name:
      name: Name
      description: New display name of the product, e.g. "Mleko 3.2%".
      example: "Mleko 3.2%"
      selector:
        text:
    ai_prompt:
      name: AI prompt
      description: >
        New English detection prompt for YOLO-World, e.g. "milk carton".
        Optional here: set an empty value to clear the prompt; the item is
        then no longer auto-detected.
      example: "milk carton"
      selector:
        text:
    quantity:
      name: Quantity
      description: New quantity (0 or more, decimals allowed).
      example: 2
      selector:
        number:
          min: 0
          max: 9999
          step: 0.5
          mode: box
    location:
      name: Location
      description: New storage location of the item.
      example: "fridge"
      selector:
        text:
    unit:
      name: Unit
      description: New unit of measurement.
      example: "szt"
      selector:
        text:
    category:
      name: Category
      description: New item category.
      example: "Nabial"
      selector:
        text:
    expiry_date:
      name: Expiry date
      description: New expiration date (YYYY-MM-DD).
      example: "2026-12-31"
      selector:
        date:
    description:
      name: Description
      description: New free-text description.
      selector:
        text:
update_quantity:
  name: Update quantity
  description: >
    Increments or decrements the quantity of an inventory item and records
    the change in the history.
  fields:
    item_id:
      name: Item ID
      description: ID of the inventory item (shown on the item sensor attributes).
      required: true
      example: "6f0d3a1e8c2b4f6e9d7a1b2c3d4e5f60"
      selector:
        text:
    delta:
      name: Delta
      description: Amount to add (use a negative value to subtract; clamped at 0).
      required: true
      example: 1
      default: 1
      selector:
        number:
          min: -999
          max: 999
          step: 0.5
          mode: box
increment_item:
  name: Increment item
  description: >
    Increases an item's quantity (simple_inventory-style) and records the
    change in the history. Identify the item by item_id or by name.
  fields:
    item_id:
      name: Item ID
      description: ID of the inventory item (use either this or name).
      example: "6f0d3a1e8c2b4f6e9d7a1b2c3d4e5f60"
      selector:
        text:
    name:
      name: Name
      description: Display name of the item (case-insensitive; use either this or item_id).
      example: "Mleko 3.2%"
      selector:
        text:
    amount:
      name: Amount
      description: How much to add (decimals allowed).
      default: 1
      example: 1
      selector:
        number:
          min: 0.001
          max: 9999
          step: 0.5
          mode: box
decrement_item:
  name: Decrement item
  description: >
    Decreases an item's quantity (simple_inventory-style) and records the
    change in the history. The quantity is clamped at zero. Identify the
    item by item_id or by name.
  fields:
    item_id:
      name: Item ID
      description: ID of the inventory item (use either this or name).
      example: "6f0d3a1e8c2b4f6e9d7a1b2c3d4e5f60"
      selector:
        text:
    name:
      name: Name
      description: Display name of the item (case-insensitive; use either this or item_id).
      example: "Mleko 3.2%"
      selector:
        text:
    amount:
      name: Amount
      description: How much to subtract (decimals allowed).
      default: 1
      example: 1
      selector:
        number:
          min: 0.001
          max: 9999
          step: 0.5
          mode: box
get_history:
  name: Get history
  description: >
    Returns the change history newest-first (add/update/delete/increment/
    decrement, with before-and-after quantities, timestamps and the source:
    vision camera or manual). Supports response_variable in automations.
  fields:
    limit:
      name: Limit
      description: Maximum number of events to return (1-500).
      default: 50
      example: 50
      selector:
        number:
          min: 1
          max: 500
          step: 1
          mode: box
clear_history:
  name: Clear history
  description: Deletes all recorded change history events.
delete_item:
  name: Delete item
  description: Removes an inventory item, records the deletion and re-parameterizes the AI model.
  fields:
    item_id:
      name: Item ID
      description: ID of the inventory item to delete.
      required: true
      example: "6f0d3a1e8c2b4f6e9d7a1b2c3d4e5f60"
      selector:
        text:
reparameterize_model:
  name: Reparameterize model
  description: >
    Gathers all unique AI prompts from the inventory and pushes them to the
    Vision AI add-on via /api/set_classes.
